name: Prebuilt Kernel

on: workflow_dispatch

jobs:
  run-script-file-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Start Building Rookie Kernel
        run: |
          sudo apt-get update && sudo apt-get upgrade
          sudo apt-get install -y device-tree-compiler
          cd ${GITHUB_WORKSPACE}
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="${{ github.event.inputs.DEVICE_NAME }}"
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Set Properties
        id: props
        run: |
          echo "date=$(TZ=Asia/Jakarta date +%Y%m%d-%I%M%p)" >> $GITHUB_OUTPUT
       
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
        
      - name: Add and Commit file
        run: |
          git add -A
          git commit -m "Ready to download"
          git push
        
