name: Warning! Delete all

on:
  workflow_dispatch:

jobs:
  Cleaning:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Working
      run: |
        cd ${GITHUB_WORKSPACE}
        mkdir .temp
        mv scripts .temp
        mv action.yml .temp
        rm -rf *
        cd .temp
        mv * ${GITHUB_WORKSPACE}
        cd ${GITHUB_WORKSPACE}
        rm -rf .temp
        
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        
    - name: Add and Commit file
      run: |
        git add -A
        git commit -m "Initial"
        git push
